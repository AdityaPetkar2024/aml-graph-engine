services:
  neo4j:
    image: neo4j:5.26
    container_name: aml-neo4j
    user: "1000:1000"            # match `id -u`:`id -g` on your machine
    ports:
      - "7474:7474"              # browser UI
      - "7687:7687"              # bolt (Python driver)
    environment:
      NEO4J_AUTH: neo4j/password123
      NEO4J_PLUGINS: '["apoc", "graph-data-science"]'
      NEO4J_server_memory_heap_max__size: 2G     # use 1G on an 8 GB laptop
      NEO4J_server_memory_pagecache_size: 2G     # use 1G on an 8 GB laptop
      NEO4J_dbms_security_procedures_unrestricted: "apoc.*,gds.*"
    volumes:
      - ./neo4j_data:/data
      - ./data/processed:/import
